version: "3.9"

networks:
  open-webui-network:
    driver: bridge

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    networks:
      - ai-network
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - ENABLE_SIGNUP=true          # Включить для создания первого админа, потом выключить
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - OPENWEATHER_API_KEY="sk-5y1aY1xjEWu0qWE62qUNr08bJBxte9KAMmhz5Atfdps"
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      - litellm